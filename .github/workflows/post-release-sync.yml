name: Sync develop after release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sync-develop:
    name: Sync manifest, version, and changelog to develop
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GHCR_PAT }}

      - name: Copy release artifacts from main
        run: |
          git config user.name "lema-bot"
          git config user.email "bot@lema.ufpb.br"
          git fetch origin main
          git checkout origin/main -- \
            .release-please-manifest.json \
            package.json \
            CHANGELOG.md

      - name: Commit and push
        run: |
          git commit -m "chore(release): sync develop after ${{ github.event.release.tag_name }}"
          git push origin develop
