name: Sync develop after release

on:
  release:
    types: [published]

concurrency:
  group: post-release-sync-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-develop:
    name: Sync manifest, version, and changelog to develop
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          token: ${{ secrets.CICD_TOKEN }}

      - name: Copy release artifacts from main
        run: |
          git config user.name "lema-bot"
          git config user.email "bot@lema.ufpb.br"
          git fetch origin main
          git checkout origin/main -- \
            .release-please-manifest.json \
            package.json \
            CHANGELOG.md

      - name: Commit and push
        run: |
          if git diff --cached --quiet; then
            echo "Nada para sincronizar, pulando commit."
            exit 0
          fi
          git commit -m "chore(release): sync develop after ${{ github.event.release.tag_name }}"
          git push origin develop

      - name: "🧹 Limpar workspace do job (_work)"
        if: always()
        # NÃO remover o diretório github.workspace em si — o post-step do
        # actions/checkout roda depois deste job e precisa que ele ainda
        # exista (senão o runner falha ao iniciar o node com ENOENT).
        run: find "${{ github.workspace }}" -mindepth 1 -delete
