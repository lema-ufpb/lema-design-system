name: Sync develop after release

on:
  release:
    types: [published]

concurrency:
  group: post-release-sync-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-develop:
    name: Sync manifest, version, and changelog to develop
    runs-on: ubuntu-latest
    steps:
      - name: "🔐 Gerar token do GitHub App"
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CICD_APP_ID }}
          private-key: ${{ secrets.CICD_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          token: ${{ steps.app-token.outputs.token }}

      - name: Copy release artifacts from main
        run: |
          git config user.name "lema-bot"
          git config user.email "bot@lema.ufpb.br"
          git fetch origin main
          git checkout origin/main -- \
            .release-please-manifest.json \
            package.json \
            CHANGELOG.md

      - name: Commit and push
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --cached --quiet; then
            echo "Nada para sincronizar, pulando commit."
            exit 0
          fi
          git commit -m "chore(release): sync develop after $RELEASE_TAG"
          git push origin develop
