name: "🛠️ CI - Pull Request Checks"

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# Cancela runs antigos no mesmo PR/branch quando há novo push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Princípio do menor privilégio: jobs de CI só precisam ler o repo.
# PR contém código não confiável → roda em runner efêmero do GitHub,
# nunca em self-hosted, para não expor infraestrutura própria a PRs maliciosas.
permissions:
  contents: read

# Pipeline sequencial: lint → test → build.
# Cada job é independente (status check próprio em branch protection) e
# executa em ordem via `needs:`. Fail-fast: se lint quebra, test e build
# não rodam — economiza tempo de runner em PRs com erros simples.
#
# Exclusão explícita: PRs do release-please nunca rodam CI (já são filtrados
# pelo trigger `branches: [develop]`, pois release-please PRs vão para main —
# mas a guarda explícita protege contra mudanças futuras no trigger).
jobs:
  lint:
    name: "🕵️‍♂️ Lint"
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🧰 Setup Node + Deps"
        uses: ./.github/actions/setup-node-deps

      - name: "💅 Run formatter check"
        run: |
          echo "🔍 Verificando formatação do código..."
          npm run format:check
          echo "✨ Formatação aprovada!"

      - name: "✨ Run linter"
        run: |
          echo "🕵️‍♂️ O inspetor de código entrou em ação!"
          npm run lint
          echo "🌺 Linter aprovado! Seu código está lindo!"

  # public/r é versionado (consumers instalam via ds.lema.ufpb.br/r e GitHub),
  # mas é derivado de registry.json + components/. Este job garante que o PR
  # commitou o resultado de `registry:build` — nem desatualizado, nem regenerado
  # à toa — evitando churn e drift entre fonte e artefato publicado.
  registry:
    name: "🧩 Registry em dia"
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🧰 Setup Node + Deps"
        uses: ./.github/actions/setup-node-deps

      - name: "🔎 Validar registry"
        run: npm run registry:check

      - name: "🧩 Reconstruir public/r e comparar com o commitado"
        run: |
          npm run registry:build
          if [ -n "$(git status --porcelain -- public/r)" ]; then
            echo "::error::public/r está fora de sincronia com registry.json/components. Rode 'make registry' e commite o resultado."
            git status --short -- public/r
            git diff --stat -- public/r
            exit 1
          fi
          echo "✅ public/r está em sincronia!"

  build:
    name: "📦 Build"
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🧰 Setup Node + Deps"
        uses: ./.github/actions/setup-node-deps

      # Mesmo alvo que o Dockerfile usa no CD (Storybook + docs de componentes),
      # para que falhas do build de release apareçam já no PR.
      - name: "📦 Run Build (Storybook + component docs)"
        run: |
          echo "🚀 Iniciando o processo de build..."
          make build-storybook
          echo "🎉 Build concluído sem erros!"

  docker-scan:
    name: "🐳 Build & escanear imagem Docker com Trivy"
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🧹 Liberar espaço em disco"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: "🔨 Build da imagem Docker (local, sem push)"
        run: docker build -t design-system:ci-scan .

      - name: "🔧 Instalar Trivy"
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true

      - name: "🔍 Scan da imagem com Trivy"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: design-system:ci-scan
          format: table
          ignore-unfixed: true
          exit-code: 1
          severity: HIGH,CRITICAL
          skip-setup-trivy: true
