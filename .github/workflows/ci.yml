name: "🛠️ CI - Pull Request Checks"

on:
  # CI roda apenas em PR contra develop — única vez que código novo é introduzido.
  # PRs develop→main e PRs do release-please não rodam CI (são promoção/version bump).
  # Branch protection em develop garante que código quebrado nunca chega em main.
  pull_request:
    branches: [develop]

# Cancela runs antigos no mesmo PR/branch quando há novo push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Princípio do menor privilégio: jobs de CI só precisam ler o repo.
permissions:
  contents: read

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NPM_CONFIG_CACHE: /mnt/dados/actions-runner/npm-cache
  PLAYWRIGHT_BROWSERS_PATH: /mnt/dados/playwright-browsers

# Pipeline sequencial: lint → test → build.
# Cada job é independente (status check próprio em branch protection) e
# executa em ordem via `needs:`. Fail-fast: se lint quebra, test e build
# não rodam — economiza tempo de runner em PRs com erros simples.
#
# Exclusão explícita: PRs do release-please nunca rodam CI (já são filtrados
# pelo trigger `branches: [develop]`, pois release-please PRs vão para main —
# mas a guarda explícita protege contra mudanças futuras no trigger).
jobs:
  lint:
    name: "🕵️‍♂️ Lint"
    runs-on: self-hosted
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v5

      - name: "🧰 Setup Node + Deps"
        uses: ./.github/actions/setup-node-deps

      - name: "💅 Run formatter check"
        run: |
          echo "🔍 Verificando formatação do código..."
          npm run format:check
          echo "✨ Formatação aprovada!"

      - name: "✨ Run linter"
        run: |
          echo "🕵️‍♂️ O inspetor de código entrou em ação!"
          npm run lint
          echo "🌺 Linter aprovado! Seu código está lindo!"

  build:
    name: "📦 Build"
    needs: lint
    runs-on: self-hosted
    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v5

      - name: "🧰 Setup Node + Deps"
        uses: ./.github/actions/setup-node-deps

      - name: "📦 Run Build (Storybook)"
        run: |
          echo "🚀 Iniciando o processo de build..."
          npm run build-storybook
          echo "🎉 Build concluído sem erros!"
