name: "🛠️ CI - Pull Request Checks"

on:
  pull_request:
    branches: [develop, main]

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NPM_CONFIG_CACHE: /mnt/dados/actions-runner/npm-cache

jobs:
  build:
    name: "🏗️ Check Project Build"
    runs-on: self-hosted
    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v4
        
      - name: "⚙️ Configurando Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          
      - name: "🧹 Clean install dependencies"
        run: |
          echo "🗑️ Limpando a casa (node_modules e package-lock.json)..."
          rm -rf node_modules package-lock.json
          npm cache clean --force
          echo "📦 Instalando dependências novinhas em folha..."
          npm install --legacy-peer-deps
          echo "✅ Dependências instaladas com sucesso!"
          
      - name: "📦 Run Build (Storybook)"
        run: |
          echo "🚀 Iniciando o processo de build..."
          npm run build-storybook
          echo "🎉 Build concluído sem erros!"

  lint:
    name: "🕵️‍♂️ Check Code Standards (Lint)"
    runs-on: self-hosted
    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v4
        
      - name: "⚙️ Configurando Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          
      - name: "🧹 Clean install dependencies"
        run: |
          echo "🗑️ Limpando cache e dependências antigas..."
          rm -rf node_modules package-lock.json
          npm cache clean --force
          echo "📦 Instalando as bibliotecas..."
          npm install --legacy-peer-deps
          echo "✅ Instalação finalizada!"
          
      - name: "💅 Run formatter check"
        run: |
          echo "🔍 Verificando formatação do código..."
          npm run format:check
          echo "✨ Formatação aprovada!"
          
      - name: "✨ Run linter"
        run: |
          echo "🕵️‍♂️ O inspetor de código entrou em ação!"
          npm run lint
          echo "🌺 Linter aprovado! Seu código está lindo!"

  test:
    name: "🎭 Visual Tests (Playwright)"
    runs-on: self-hosted
    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v4
        
      - name: "⚙️ Configurando Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          
      - name: "🧹 Clean install dependencies"
        run: |
          echo "🗑️ Limpando cache e dependências antigas..."
          rm -rf node_modules package-lock.json
          npm cache clean --force
          echo "📦 Instalando as bibliotecas..."
          npm install --legacy-peer-deps
          echo "✅ Instalação finalizada!"
          
      - name: "📸 Run Visual Tests"
        run: |
          echo "📸 Executando testes visuais com Playwright..."
          npm run test
          echo "✅ Testes visuais concluídos com sucesso!"
