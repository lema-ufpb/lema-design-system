name: "🚀 CD - Build and Deploy Docker Image"

on:
  release:
    types: [published]

# Não cancela um deploy em andamento — quem chegou primeiro termina.
concurrency:
  group: cd-prod
  cancel-in-progress: false

# Princípio do menor privilégio.
permissions:
  contents: read
  packages: write
  actions: read

env:
  KUSTOMIZATION_PATH: k8s/overlays/prod/lema-ufpb/kustomization.yml

jobs:
  build-and-push:
    name: "🐳 Build & Push Docker Image"
    runs-on: self-hosted
    environment: prod
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: "📥 Checkout repository (commit da tag)"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish }}

      - name: "🔑 Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: "🐳 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🏷️ Set image tag"
        id: set-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE_TAG="$RELEASE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "✨ Tag da imagem definida: $IMAGE_TAG"

      - name: "📝 Update public/r/registry.json version"
        run: |
          jq --arg v "${{ steps.set-tag.outputs.image_tag }}" \
            '.version = $v' public/r/registry.json > public/r/registry.json.tmp && \
            mv public/r/registry.json.tmp public/r/registry.json
          echo "✅ public/r/registry.json version updated to ${{ steps.set-tag.outputs.image_tag }}"

      - name: "🚀 Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.set-tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-argocd:
    name: "🔄 Update argocd-apps manifest"
    needs: build-and-push
    runs-on: self-hosted
    environment: prod
    steps:
      - name: "📥 Checkout argocd-apps repository"
        uses: actions/checkout@v5
        with:
          repository: lema-ufpb/argocd-apps
          token: ${{ secrets.GHCR_PAT }} # Assuming GHCR_PAT has access to the argocd-apps repo
          path: argocd-apps

      - name: "⚙️ Setup Kustomize"
        uses: imranismail/setup-kustomize@v2

      - name: "🔄 Update Kustomize image tag"
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "🔄 Atualizando tag da imagem para ${IMAGE_NAME}:${IMAGE_TAG}..."

          for overlay in prod dev; do
            dir="argocd-apps/apps/design-system/overlays/${overlay}"
            kustomization="${dir}/kustomization.yml"
            mkdir -p "$dir"

            if [ ! -f "$kustomization" ]; then
              echo "  → Criando ${kustomization}..."
              cat > "$kustomization" <<-YAMLEOF
				apiVersion: kustomize.config.k8s.io/v1beta1
				kind: Kustomization
				resources: []
				images:
				  - name: ${IMAGE_NAME}
				    newTag: ${IMAGE_TAG}
				YAMLEOF
              echo "  ✅ Criado ${overlay} com newTag: ${IMAGE_TAG}"
            else
              echo "  → Atualizando ${overlay}..."
              if grep -q "name: ${IMAGE_NAME}" "$kustomization"; then
                (cd "$dir" && kustomize edit set image "${IMAGE_NAME}=${IMAGE_NAME}:${IMAGE_TAG}")
                echo "  ✅ newTag atualizado via kustomize (${overlay})"
              else
                awk -v name="${IMAGE_NAME}" -v tag="${IMAGE_TAG}" '
                  /^images:/ { print; print "  - name: " name; print "    newTag: " tag; next }
                  { print }
                ' "$kustomization" > "${kustomization}.tmp" && \
                  mv "${kustomization}.tmp" "$kustomization"
                echo "  ✅ Image adicionado via awk (${overlay})"
              fi
            fi
          done
          echo "✅ Kustomize atualizado com sucesso!"

      - name: "📤 Commit and push changes"
        run: |
          cd argocd-apps
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "⚠️ Nenhuma alteração detectada. Kustomization já está atualizado."
          else
            echo "📤 Commitando alterações..."
            git commit -m "chore(design-system): update image to ${{ needs.build-and-push.outputs.image_tag }}"
            git push origin main
            echo "🎉 Deploy configurado com sucesso!"
          fi
