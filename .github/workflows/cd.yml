name: "🚀 CD - Build and Deploy Docker Image"

on:
  release:
    types: [published]

# Não cancela um deploy em andamento — quem chegou primeiro termina.
concurrency:
  group: cd-prod
  cancel-in-progress: false

# Princípio do menor privilégio.
permissions:
  contents: read
  packages: write
  actions: read

env:
  KUSTOMIZATION_PATH: k8s/overlays/prod/lema-ufpb/kustomization.yml

jobs:
  build-and-push:
    name: "🐳 Build & Push Docker Image"
    # ubuntu-latest (GitHub-hosted): o runner self-hosted está atrás de um
    # firewall/proxy que retorna 403 "Request forbidden by administrative
    # rules" ao autenticar no ghcr.io — ver run 33918878307.
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: "📥 Checkout repository (commit da tag)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish }}

      - name: "🔑 Log in to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CICD_TOKEN }}

      - name: "🐳 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "🏷️ Set image tag"
        id: set-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE_TAG="$RELEASE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "✨ Tag da imagem definida: $IMAGE_TAG"

      - name: "📝 Update public/r/registry.json version"
        run: |
          jq --arg v "${{ steps.set-tag.outputs.image_tag }}" \
            '.version = $v' public/r/registry.json > public/r/registry.json.tmp && \
            mv public/r/registry.json.tmp public/r/registry.json
          echo "✅ public/r/registry.json version updated to ${{ steps.set-tag.outputs.image_tag }}"

      - name: "🚀 Build and push Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=${{ steps.set-tag.outputs.image_tag }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.set-tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "🧹 Limpar imagens Docker não usadas"
        if: always()
        run: docker image prune -f

      - name: "🧹 Limpar workspace do job (_work)"
        if: always()
        # NÃO remover o diretório github.workspace em si — os post-steps do
        # checkout/buildx/login/build-push rodam depois deste job e precisam
        # que ele ainda exista (senão o runner falha ao iniciar o node com ENOENT).
        run: find "${{ github.workspace }}" -mindepth 1 -delete

  update-argocd:
    name: "🔄 Update argocd-apps manifest"
    needs: build-and-push
    runs-on: self-hosted
    environment: prod
    steps:
      - name: "📥 Checkout argocd-apps repository"
        uses: actions/checkout@v7
        with:
          repository: lema-ufpb/argocd-apps
          token: ${{ secrets.CICD_TOKEN }} # Assuming GHCR_PAT has access to the argocd-apps repo
          path: argocd-apps

      - name: "⚙️ Setup Kustomize"
        run: |
          curl -sLo /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          mv /tmp/kustomize "$HOME/.local/bin/kustomize"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kustomize" version

      - name: "🔄 Update Kustomize image tag"
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "🔄 Atualizando tag da imagem para ${IMAGE_NAME}:${IMAGE_TAG}..."

          # O overlay "dev" foi removido do repo argocd-apps (colidia com os
          # mesmos namespaces do "prod") — só "prod" existe hoje.
          for overlay in prod; do
            dir="argocd-apps/apps/design-system/overlays/${overlay}"
            (cd "$dir" && kustomize edit set image "${IMAGE_NAME}=${IMAGE_NAME}:${IMAGE_TAG}")
            echo "  ✅ newTag atualizado (${overlay})"
          done
          echo "✅ Kustomize atualizado com sucesso!"

      - name: "📤 Commit and push changes"
        run: |
          cd argocd-apps
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "⚠️ Kustomization já está atualizado com a tag ${{ needs.build-and-push.outputs.image_tag }}."
            echo "📤 Criando commit vazio para forçar reconciliação no ArgoCD..."
            git commit --allow-empty -m "chore(design-system): reconcile image ${{ needs.build-and-push.outputs.image_tag }} [no-op]"
          else
            echo "📤 Commitando alterações..."
            git commit -m "chore(design-system): update image to ${{ needs.build-and-push.outputs.image_tag }}"
          fi
          git push origin main
          echo "🎉 Deploy configurado com sucesso!"

      - name: "🧹 Limpar workspace do job (_work)"
        if: always()
        # NÃO remover o diretório github.workspace em si — o post-step do
        # actions/checkout roda depois deste job e precisa que ele ainda
        # exista (senão o runner falha ao iniciar o node com ENOENT).
        run: find "${{ github.workspace }}" -mindepth 1 -delete
