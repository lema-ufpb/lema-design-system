name: "🚀 CD - Build and Deploy Docker Image"

on:
  release:
    types: [published]

# Não cancela um deploy em andamento — quem chegou primeiro termina.
concurrency:
  group: cd-prod
  cancel-in-progress: false

# Princípio do menor privilégio.
permissions:
  contents: read
  packages: write
  actions: read

env:
  KUSTOMIZATION_PATH: k8s/overlays/prod/lema-ufpb/kustomization.yml

jobs:
  verify-ci:
    name: "✅ Verifica CI verde no commit da release"
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: "🏷️ Resolver tag e SHA da release"
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.event.release.target_commitish }}
        run: |
          echo "🏷️ Tag da release: $RELEASE_TAG"
          echo "📍 SHA da release: $RELEASE_SHA"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: "🔎 Garantir que CI passou neste commit"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          echo "🔎 Consultando status do CI para $SHA..."
          CONCLUSION=$(gh api \
            "repos/$REPO/actions/runs?head_sha=$SHA&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.name | test("CI"))] | first | .conclusion // "none"')
          echo "📊 Conclusão do CI: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ CI não está verde neste commit. Abortando deploy."
            exit 1
          fi
          echo "✅ CI verde — liberando deploy."

  build-and-push:
    name: "🐳 Build & Push Docker Image"
    needs: verify-ci
    runs-on: self-hosted
    environment: prod
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: "📥 Checkout repository (commit da tag)"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.verify-ci.outputs.sha }}

      - name: "🔑 Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: "🐳 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🏷️ Set image tag"
        id: set-tag
        env:
          RELEASE_TAG: ${{ needs.verify-ci.outputs.tag }}
        run: |
          IMAGE_TAG="$RELEASE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "✨ Tag da imagem definida: $IMAGE_TAG"

      - name: "📝 Update public/r/registry.json version"
        run: |
          jq --arg v "${{ steps.set-tag.outputs.image_tag }}" \
            '.version = $v' public/r/registry.json > public/r/registry.json.tmp && \
            mv public/r/registry.json.tmp public/r/registry.json
          echo "✅ public/r/registry.json version updated to ${{ steps.set-tag.outputs.image_tag }}"

      - name: "🚀 Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.set-tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-argocd:
    name: "🔄 Update argocd-apps manifest"
    needs: build-and-push
    runs-on: self-hosted
    environment: prod
    steps:
      - name: "📥 Checkout argocd-apps repository"
        uses: actions/checkout@v5
        with:
          repository: lema-ufpb/argocd-apps
          token: ${{ secrets.GHCR_PAT }} # Assuming GHCR_PAT has access to the argocd-apps repo
          path: argocd-apps

      - name: "⚙️ Setup Kustomize"
        uses: imranismail/setup-kustomize@v2

      - name: "🔄 Update Kustomize image tag"
        run: |
          echo "🔄 Atualizando a tag da imagem no Kustomize (prod e dev)..."
          cd argocd-apps/apps/design-system/overlays/prod
          kustomize edit set image ghcr.io/${{ github.repository }}=ghcr.io/${{ github.repository }}:${{ needs.build-and-push.outputs.image_tag }}
          cd ../dev
          kustomize edit set image ghcr.io/${{ github.repository }}=ghcr.io/${{ github.repository }}:${{ needs.build-and-push.outputs.image_tag }}
          echo "✅ Kustomize atualizado com sucesso!"

      - name: "📤 Commit and push changes"
        run: |
          echo "📤 Preparando para fazer o commit no ArgoCD repo..."
          cd argocd-apps
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "chore(design-system): update image to ${{ needs.build-and-push.outputs.image_tag }} 🚀"
          git push origin main
          echo "🎉 Deploy configurado com sucesso!"
