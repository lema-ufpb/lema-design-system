name: "🎁 Release Please"

on:
  push:
    branches:
      - main

# Garante que só uma execução do release-please rode por vez na main.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "📦 Run release-please"
    runs-on: self-hosted
    steps:
      - name: "🚀 Release Please"
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GHCR_PAT }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: "🤖 Auto-merge release PR"
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: gh pr merge --auto --admin --merge "${{ fromJSON(steps.release.outputs.pr).number }}"
