name: "🎁 Release Please"

on:
  push:
    branches:
      - main

# Garante que só uma execução do release-please rode por vez na main.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "📦 Run release-please"
    runs-on: self-hosted
    steps:
      - name: "🚀 Release Please"
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GHCR_PAT }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: "🤖 Auto-merge release PR"
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          curl -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ fromJSON(steps.release.outputs.pr).number }}/merge" \
            -d '{"merge_method":"merge"}'

      - name: "🧹 Limpar workspace do job (_work)"
        if: always()
        # NÃO remover o diretório github.workspace em si — o post-step do
        # actions/checkout roda depois deste job e precisa que ele ainda
        # exista (senão o runner falha ao iniciar o node com ENOENT).
        run: find "${{ github.workspace }}" -mindepth 1 -delete
