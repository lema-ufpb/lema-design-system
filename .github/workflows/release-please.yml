name: "🎁 Release Please"

on:
  push:
    branches:
      - main

# Garante que só uma execução do release-please rode por vez na main.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "📦 Run release-please"
    runs-on: self-hosted
    steps:
      - name: "🚀 Release Please"
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.CICD_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # O auto-merge foi removido (ver PR que introduziu este comentário):
      # o release-please vem falhando em localizar a última release via
      # GraphQL ("Expected 1 releases, only found 0") mesmo com o
      # CICD_TOKEN tendo escopo `repo` completo, e por isso recalcula a
      # versão a partir de todo o histórico de commits, propondo um
      # downgrade (ex.: 1.7.1 quando main já está em 1.10.1). Mergear
      # essa PR automaticamente corrompeu `main` mais de uma vez. Até a
      # causa raiz ser encontrada, a PR de release fica aberta para
      # revisão humana — este step só sinaliza (sem falhar o job) quando
      # a versão proposta parece um downgrade.
      - name: "🛡️ Sinalizar versão proposta suspeita"
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.CICD_TOKEN }}
        run: |
          PR_NUMBER="${{ fromJSON(steps.release.outputs.pr).number }}"
          REPO="${{ github.repository }}"

          PR_TITLE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" \
            | grep -oE '"title"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n1 | sed -E 's/^"title"[[:space:]]*:[[:space:]]*"//; s/"$//')
          NEW_VERSION=$(echo "$PR_TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)

          CURRENT_VERSION=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$REPO/contents/.release-please-manifest.json?ref=main" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)

          echo "PR #$PR_NUMBER propõe versão '$NEW_VERSION'; manifest atual em main é '$CURRENT_VERSION'."

          if [ -z "$NEW_VERSION" ] || [ -z "$CURRENT_VERSION" ]; then
            echo "::warning::Não foi possível determinar as versões para comparação (nova='$NEW_VERSION' atual='$CURRENT_VERSION') na PR #$PR_NUMBER. Revise manualmente antes de mergear."
            exit 0
          fi

          HIGHEST=$(printf '%s\n%s\n' "$NEW_VERSION" "$CURRENT_VERSION" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$NEW_VERSION" ] || [ "$NEW_VERSION" = "$CURRENT_VERSION" ]; then
            echo "::warning::PR #$PR_NUMBER propõe versão '$NEW_VERSION', que não é maior que a versão atual do manifest ('$CURRENT_VERSION'). NÃO mergear sem investigar — provável falha do release-please em localizar a última release."
          fi

      - name: "🧹 Limpar workspace do job (_work)"
        if: always()
        # NÃO remover o diretório github.workspace em si — o post-step do
        # actions/checkout roda depois deste job e precisa que ele ainda
        # exista (senão o runner falha ao iniciar o node com ENOENT).
        run: find "${{ github.workspace }}" -mindepth 1 -delete
