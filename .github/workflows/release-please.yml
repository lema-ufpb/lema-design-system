name: "🎁 Release Please"

on:
  push:
    branches:
      - main

# Garante que só uma execução do release-please rode por vez na main.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "📦 Run release-please"
    runs-on: self-hosted
    steps:
      - name: "🚀 Release Please"
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.CICD_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: "🛡️ Validar versão proposta antes do auto-merge"
        id: guard
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.CICD_TOKEN }}
        run: |
          PR_NUMBER="${{ fromJSON(steps.release.outputs.pr).number }}"
          PR_TITLE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json title -q .title)
          NEW_VERSION=$(echo "$PR_TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          CURRENT_VERSION=$(gh api "repos/${{ github.repository }}/contents/.release-please-manifest.json?ref=main" --jq '.content' | base64 -d | jq -r '.["."]')

          echo "PR #$PR_NUMBER propõe versão '$NEW_VERSION'; manifest atual em main é '$CURRENT_VERSION'."

          if [ -z "$NEW_VERSION" ] || [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Não foi possível determinar as versões para comparação (nova='$NEW_VERSION' atual='$CURRENT_VERSION'). Abortando auto-merge por segurança — revise a PR #$PR_NUMBER manualmente."
            exit 1
          fi

          HIGHEST=$(printf '%s\n%s\n' "$NEW_VERSION" "$CURRENT_VERSION" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$NEW_VERSION" ] || [ "$NEW_VERSION" = "$CURRENT_VERSION" ]; then
            echo "::error::PR #$PR_NUMBER propõe versão '$NEW_VERSION', que não é maior que a versão atual do manifest ('$CURRENT_VERSION'). Isso normalmente indica que o release-please não conseguiu localizar a última release (ver CICD_TOKEN) e recalculou a versão a partir do histórico completo. Abortando auto-merge — feche/investigue a PR #$PR_NUMBER manualmente antes de mergear."
            exit 1
          fi

      - name: "🤖 Auto-merge release PR"
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.CICD_TOKEN }}
        run: |
          curl -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ fromJSON(steps.release.outputs.pr).number }}/merge" \
            -d '{"merge_method":"merge"}'

      - name: "🧹 Limpar workspace do job (_work)"
        if: always()
        # NÃO remover o diretório github.workspace em si — o post-step do
        # actions/checkout roda depois deste job e precisa que ele ainda
        # exista (senão o runner falha ao iniciar o node com ENOENT).
        run: find "${{ github.workspace }}" -mindepth 1 -delete
