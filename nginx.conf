server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public /registry.json and /r/registry.json
    location ~ ^/(registry\.json|r/registry\.json)$ {
        # CORS preflight required for shadcn CLI
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*';
        try_files $uri =404;
    }

    # Protect other /r/ files with Token
    location ~ ^/r/.*$ {
        # CORS preflight required for shadcn CLI
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        set $token_match 0;
        
        # Check Authorization header (CLI)
        if ($http_authorization = "Bearer ${REGISTRY_TOKEN}") {
            set $token_match 1;
        }
        
        # Check Query String (?token=...)
        if ($arg_token = "${REGISTRY_TOKEN}") {
            set $token_match 1;
        }

        # Set default type for the location in case of 401
        default_type application/json;

        # If failed, return 401
        if ($token_match = 0) {
            add_header 'Access-Control-Allow-Origin' '*';
            return 401 '{"error": "Unauthorized", "message": "Invalid or missing token. Please configure REGISTRY_TOKEN in your environment."}';
        }

        # If passed, allow component download with CORS permissions
        add_header 'Access-Control-Allow-Origin' '*';
        try_files $uri $uri/ =404;
    }

    # Machine-readable component documentation for AI agents
    location /docs/ {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Content-Type' 'application/json';
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
